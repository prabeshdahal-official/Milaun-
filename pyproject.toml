[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "milaun"
version = "0.1.0"
description = "Offline record linkage for Nepali names across Devanagari and Latin spellings"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Prabesh Dahal" }]
keywords = [
    "record-linkage",
    "entity-resolution",
    "nepali",
    "devanagari",
    "phonetic-matching",
    "low-resource",
    "public-interest-tech",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Nepali",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
milaun = "milaun.cli:main"

[project.urls]
Homepage = "https://github.com/prabeshdahal/milaun"
Documentation = "https://github.com/prabeshdahal/milaun/tree/main/docs"
Issues = "https://github.com/prabeshdahal/milaun/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
milaun = ["data/*.json", "web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
